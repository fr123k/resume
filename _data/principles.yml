description: "After reading the book 'Principles' by Ray Dalio. I was inspired to put together my personal working principles."
principles:
- title: "Meeting"
  rules:
    - title: "Don't take the time and attention of work colleagues for granted."

- title: "Change"
  rules:
    - title: "The power of change and adaptation starts with yourself."

- title: "Efficiency"
  rules:
    - title: "Just work smart — break repeating cycles, focus on the ratio of time and outcome."

- title: "Tools / People"
  rules:
    - title: "Tools have to follow people, not the people the tools."

- title: "Leadership"
  rules:
    - title: "It's not about you — focus has to be on the people to lead, help them to grow."
    - title: "It's all about you — be authentic and lead by example."